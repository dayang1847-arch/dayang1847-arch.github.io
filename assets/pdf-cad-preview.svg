<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none">
  <title>PDF to CAD — synthetic drawing</title>
  <desc>An original abstract blueprint showing a PDF page becoming editable CAD linework. No real drawing or conversion history is used.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#c9e8f5" stroke-opacity=".07"/></pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#183e5e"/><stop offset="1" stop-color="#102d49"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" stroke="#81bed5" stroke-width="1.2"/></marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif"><text x="50" y="56" font-size="13" letter-spacing="3" fill="#a8c6d9">DRAWING WORKSHOP</text><text x="50" y="102" font-size="33" font-weight="500" fill="#f0f7fc">From page to geometry.</text></g>
  <g transform="translate(50 143)">
    <path d="M0 0H260L290 30V284H0Z" fill="#f4f8fc"/>
    <path d="M260 0V30H290" stroke="#d0dce8" stroke-width="2"/>
    <g stroke="#6b8198" stroke-width="2.3"><path d="M45 86H211V216H45Z"/><path d="M79 120H177V182H79Z"/><path d="M45 86L66 65H232V195L211 216M211 86L232 65M211 216V86"/><path d="M45 147H211M128 65V216" stroke-dasharray="7 6" stroke-width="1"/><circle cx="61" cy="102" r="5"/><circle cx="195" cy="102" r="5"/><circle cx="61" cy="200" r="5"/><circle cx="195" cy="200" r="5"/></g>
    <g font-family="Arial, sans-serif" fill="#6b8198"><text x="22" y="32" font-size="12" letter-spacing="2">PDF</text><text x="22" y="263" font-size="10" letter-spacing="1.3">SYNTHETIC DRAWING</text></g>
  </g>
  <path d="M376 284H461M445 267L462 284L445 301" stroke="#91b4cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(513 143)">
    <rect width="397" height="284" rx="8" fill="#123a5a" stroke="#497690"/>
    <path d="M26 43H371M26 241H371M46 22V262M348 22V262" stroke="#b9e0ee" stroke-opacity=".14"/>
    <g transform="translate(64 39)" stroke="#c3e7f0" stroke-width="2.3" stroke-linejoin="round"><path d="M0 47H166V177H0Z"/><path d="M34 81H132V143H34Z"/><path d="M0 47L21 26H187V156L166 177M166 47L187 26M166 177V47"/><path d="M-20 108H206M83 7V193" stroke="#8bc3d7" stroke-dasharray="7 6" stroke-width="1"/><circle cx="16" cy="63" r="5"/><circle cx="150" cy="63" r="5"/><circle cx="16" cy="161" r="5"/><circle cx="150" cy="161" r="5"/></g>
    <g stroke="#81bed5" stroke-width="1"><path d="M64 223H230" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M64 211V235M230 211V235"/><path d="M277 65V216" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M265 65H289M265 216H289"/></g>
    <g fill="#eacb91"><rect x="60" y="82" width="8" height="8"/><rect x="226" y="82" width="8" height="8"/><rect x="60" y="212" width="8" height="8"/><rect x="226" y="212" width="8" height="8"/><rect x="247" y="61" width="8" height="8"/></g>
    <g font-family="Arial, sans-serif"><text x="22" y="30" font-size="12" letter-spacing="2" fill="#c3e7f0">CAD</text><text x="22" y="264" font-size="10" letter-spacing="1.8" fill="#8cb7ce">DWG / DXF</text><text x="309" y="264" font-size="10" letter-spacing="1.5" fill="#eacb91">EDITABLE</text></g>
  </g>
  <g font-family="Arial, sans-serif" fill="#91b4cc" font-size="12" letter-spacing="1.8"><text x="50" y="482">VECTOR + SCAN</text><text x="717" y="482">PROCESSED LOCALLY</text></g>
