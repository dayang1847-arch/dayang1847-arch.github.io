name: Import verified LUMINA release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lumina-release.yml', '.lumina-release.json']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and import the prepared public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, base64, hashlib, subprocess, urllib.request, time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          m=json.loads(Path('.lumina-release.json').read_text())
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          if parent!=m['base']:raise SystemExit('Release base changed; refusing to overwrite unrelated changes')
          def fetch(sha):
              url='https://api.github.com/repos/'+os.environ['GH_REPOSITORY']+'/git/blobs/'+sha
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
                      with urllib.request.urlopen(req,timeout=60) as response:data=json.load(response)
                      b=base64.b64decode(data['content'])
                      if hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()!=sha:raise ValueError('Blob integrity failure')
                      return b
                  except Exception:
                      if attempt==3:raise
                      time.sleep(2**attempt)
          pack=Path(os.environ['RUNNER_TEMP'])/'lumina-release.pack'
          with ThreadPoolExecutor(max_workers=4) as pool,pack.open('wb') as out:
              for b in pool.map(fetch,m['blobs']):out.write(b)
          if pack.stat().st_size!=m['bytes'] or hashlib.sha256(pack.read_bytes()).hexdigest()!=m['sha256']:raise SystemExit('Release integrity failure')
          with pack.open('rb') as f:subprocess.run(['git','index-pack','--stdin'],stdin=f,check=True)
          subprocess.run(['git','cat-file','-e',m['target']+'^{commit}'],check=True)
          subprocess.run(['git','read-tree','--reset','-u',m['target']],check=True)
          # The reviewed tree contains only the existing site and the LUMINA public update.
          # Import removes this one-off workflow and its manifest from the final site tree.
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-q','-m','Publish LUMINA 1.2.60: current models, mobile UI and four languages'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('Verified release imported:',m['target'])
          PY
