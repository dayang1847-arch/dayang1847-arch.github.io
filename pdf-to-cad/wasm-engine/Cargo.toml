[package]
name = "pdf-cad-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser-local DXF to native binary DWG bridge using acadrust"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acadrust = { version = "=0.5.5", default-features = false }
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
