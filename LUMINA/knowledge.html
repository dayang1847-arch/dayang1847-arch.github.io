<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LUMINA · 演示资料库</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#294452;font:15px/1.7 system-ui}main{max-width:1060px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}a{color:#1b78a7;text-decoration:none}h1{font-size:30px}small{color:#6a8392}nav{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}nav a{background:white;padding:12px 18px;border:1px solid #dce6eb;border-radius:9px}input{font:inherit;width:100%;padding:14px;border:1px solid #ccdce5;border-radius:10px}#list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}article{background:white;padding:18px;border:1px solid #e0e8ec;border-radius:12px}article strong,article small{display:block}article p{font-size:13px}button{font:inherit;min-height:44px;border:1px solid #ccdce5;background:white;border-radius:8px;padding:8px 20px;color:#2b5e79;cursor:pointer}footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px}@media(max-width:700px){#list{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:24px}main{padding:22px 16px}}</style><main><header><div><small>LUMINA / PUBLIC DEMO 1.2.60</small><h1>资料与使用说明</h1></div><a href="./">返回演示 ↗</a></header><p>目录参数用于初步选型。模型为目录外观重建，内部构造与模拟配光不能替代原厂资料或工程验收。</p><nav><a href="./?catalogue=1&library=1">打开三维选品仓库</a><a href="./planner-guide.html">阅读操作指南</a><a href="./?case=portfolio">浏览照明案例</a></nav><label for="q">查找目录型号与系列</label><input id="q" type="search" placeholder="例如 Roadstar、线性灯、筒灯"><p id="count" role="status">正在加载目录…</p><section id="list"></section><footer><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></footer></main><script type="module">let products=[],page=0;const q=document.querySelector('#q'),list=document.querySelector('#list');function render(){const s=q.value.trim().toLowerCase(),found=products.filter(p=>[p.name,p.model,p.category,p.catalogue.series].join(' ').toLowerCase().includes(s)),pages=Math.max(1,Math.ceil(found.length/24));page=Math.min(page,pages-1);list.replaceChildren();for(const p of found.slice(page*24,(page+1)*24)){const a=document.createElement('article'),title=document.createElement('strong'),sub=document.createElement('small'),text=document.createElement('p');title.textContent=p.name;sub.textContent=p.model+' · '+p.category+' · v'+p.version;text.textContent=Object.entries(p.catalogue.specs).filter(([k])=>/尺寸|色温|功率|防护/.test(k)).map(([k,v])=>k+'：'+v).join(' / ');a.append(title,sub,text);list.append(a)}document.querySelector('#count').textContent=found.length+' 款匹配 · 目录资料，不含供应商报价';document.querySelector('#page').textContent=(page+1)+' / '+pages;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page>=pages-1}q.oninput=()=>{page=0;render()};for(const [id,d]of [['prev',-1],['next',1]])document.querySelector('#'+id).onclick=()=>{page+=d;render();window.scrollTo(0,0)};try{const r=await fetch('./demo-catalogue.json');if(!r.ok)throw Error();const s=await r.json();products=[...new Map(s.products.filter(p=>p.catalogue).sort((a,b)=>a.version-b.version).map(p=>[p.id,p])).values()];render()}catch{document.querySelector('#count').textContent='目录暂时未加载，请刷新重试。'}</script></html>
