<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>LUMINA · 正在进入</title>
  <script data-view-transport="keepalive" data-view-page="lumina" data-endpoint="https://astra-ocean-views.umi-ilot.workers.dev/views">
  (() => {
    const origin = 'https://lumina-access.umi-ilot.workers.dev';
    const fallback = '/LUMINA/image-showcase.html';
    const version = '1.3.108';
    const requested = /\/login(?:\.html)?$/.test(location.pathname)
      ? new URLSearchParams(location.search).get('next')
      : location.pathname + location.search + location.hash;
    let target = new URL(fallback, origin);
    if (requested?.startsWith('/LUMINA/')) {
      const candidate = new URL(origin + requested);
      if (candidate.pathname.startsWith('/LUMINA/')) target = candidate;
    }
    target.searchParams.set('v', version);

    if (location.origin === 'https://dayang1847-arch.github.io' && globalThis.crypto?.randomUUID) {
      const {endpoint, viewPage} = document.currentScript.dataset;
      fetch(endpoint, {
        method: 'POST',
        mode: 'cors',
        credentials: 'omit',
        keepalive: true,
        referrerPolicy: 'no-referrer',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({project: viewPage, eventId: crypto.randomUUID()})
      }).catch(() => {});
    }

    // Only a page controlled by the old Pages worker needs to wait for cleanup.
    async function leave() {
      try {
        const workers = navigator.serviceWorker;
        if (workers?.controller) {
          const cleanup = workers.getRegistration('/LUMINA/').then(registration => {
            if (registration && new URL(registration.scope).pathname === '/LUMINA/') {
              return registration.unregister();
            }
          });
          await Promise.race([cleanup, new Promise(resolve => setTimeout(resolve, 700))]);
        }
      } catch {}
      location.replace(target);
    }
    void leave();
  })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=https://lumina-access.umi-ilot.workers.dev/LUMINA/image-showcase.html?v=1.3.108"></noscript>
</head>
<body>
  <p>正在进入 LUMINA 安全登录入口…</p>
  <p><a href="https://lumina-access.umi-ilot.workers.dev/LUMINA/image-showcase.html?v=1.3.108">点击继续登录 LUMINA</a></p>
</body>
</html>
